apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci-build-test-scan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  validate:
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Validate repository structure
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "Validating demo repository structure"
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          test -f helm/unify-demo-app/Chart.yaml
          echo "Repository structure is ready"
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Validate — repository structure
            - `k8s/deployment.yaml`: present
            - `k8s/service.yaml`: present
            - `helm/unify-demo-app/Chart.yaml`: present
            - Status: **ready**
  unit-tests:
    needs:
      - validate
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Describe recorded demo test results
        uses: docker://node:20-alpine
        shell: sh
        run: |
          echo "Publishing a recorded demo fixture; no application tests execute in this step"
          echo "14 passed, 1 failed, 1 skipped"
      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        continue-on-error: true
        with:
          test-type: JUNIT
          results-path: test-reports/junit.xml
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Recorded demo test results — orders-api
            This is a static fixture, not a fresh application test run. The workflow
            deliberately continues so that the test failure can be explored in the UI.
            - Tests: 16
            - Passed: 14
            - Failed: 1 (`test_retry_on_gateway_timeout`)
            - Skipped: 1
            - Results published to the **Test results** tab
  security-scan:
    needs:
      - unit-tests
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Explain the security demo fixture
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "This job does not execute a security scanner or enforce a security policy."
          echo "The repository includes an intentional credential-shaped demo fixture."
          echo "Check the component Security tab to verify actual scanner configuration and findings."
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Security — demo fixture and verification boundary
            This job does not run a scanner. `src/config.py` contains an intentional
            credential-shaped fixture. Verify scanning and findings in this organization's
            component **Security** tab before describing them as observed results.
  package:
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Create build metadata
        kind: build
        uses: docker://alpine:3.20
        shell: sh
        run: |
          mkdir -p build
          cat > build/release-metadata.json <<JSON
          {
            "application": "customer-portal",
            "component": "orders-api",
            "version": "1.4.${{ cloudbees.run_number }}",
            "commit": "${{ cloudbees.scm.sha }}",
            "scenario": "candidate-demo",
            "simulation": true,
            "securityPolicy": "not-evaluated-by-this-workflow",
            "testStatus": "recorded-fixture-14-passed-1-failed-1-skipped"
          }
          JSON
          cat build/release-metadata.json
      - name: Register build artifact
        id: register-artifact
        uses: cloudbees-io/register-build-artifact@v2
        with:
          name: orders-api
          version: 1.4.${{ cloudbees.run_number }}
          url: docker.io/cloudbeesdemo/orders-api:1.4.${{ cloudbees.run_number }}
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Package — build metadata + registered artifact
            - Application: customer-portal
            - Component: orders-api
            - Version: 1.4.${{ cloudbees.run_number }}
            - Registered artifact ID: ${{ steps.register-artifact.outputs.artifact-id }}
            - Artifact URL: docker.io/cloudbeesdemo/orders-api:1.4.${{ cloudbees.run_number }}
            - Commit: ${{ cloudbees.scm.sha }}
            - Security policy: not evaluated by this workflow
            - Tests: recorded fixture; 14 passed, 1 failed, 1 skipped
            - Artifact: metadata registration only; no container image is built or pushed
    needs:
      - security-scan
    outputs:
      artifact-id: ${{ steps.register-artifact.outputs.artifact-id }}
      artifact-version: 1.4.${{ cloudbees.run_number }}
